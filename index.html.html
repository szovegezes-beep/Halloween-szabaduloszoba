<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎃 Halloween-kastély – 24 feladatos szabadulószoba</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#382451,#120e22 70%);color:#f7efff;font-family:system-ui,Segoe UI,Arial,sans-serif;line-height:1.58;min-height:100vh}main{width:min(850px,94vw);margin:30px auto;padding:clamp(18px,4vw,36px);border:2px solid #8361b6;border-radius:24px;background:#241836;box-shadow:0 20px 55px #0009}h1,h2{color:#ffd376;line-height:1.25}h1{font-size:clamp(1.7rem,4vw,2.5rem)}h2{font-size:1.65rem}button{display:inline-block;background:#ffc36c;color:#21132a;font:700 1rem system-ui;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;margin:9px 7px 5px 0}button:hover,button:focus-visible{background:#ffe0a3;outline:2px solid #fff}input{background:white;color:#171020;border:2px solid #dac5fd;border-radius:12px;font:1.2rem system-ui;padding:12px;width:min(100%,440px)}.muted{color:#d8c9ea}.panel{background:#3a2b52;border:1px solid #695383;border-radius:14px;padding:15px;margin:15px 0}.good{color:#a5ffcf}.bad{color:#ffb9b9}.choices{display:grid;gap:10px;max-width:650px}.choices label{cursor:pointer;background:#38284c;border:1px solid #7e61a2;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}.choices input{width:auto;accent-color:#ffcf74}.badge{display:inline-block;padding:4px 12px;background:#47345d;border-radius:30px;color:#f5e7ff}.progress{height:12px;border-radius:10px;background:#4a345e;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:#ffbf5b;transition:width .3s}.codes{letter-spacing:.15em;word-break:break-all;font-size:1.45rem;color:#ffd376;font-weight:800}.small{font-size:.92rem}.hidden{display:none}#feedback{min-height:1.7em}footer{opacity:.8;margin-top:18px;font-size:.9rem}</style></head><body><main id="game"></main><script>const rooms=[{"emoji": "🖱️", "name": "A kísérteties gépterem", "digit": "3"}, {"emoji": "🧩", "name": "A szellemes számítógép belseje", "digit": "1"}, {"emoji": "📁", "name": "A fájlok padlása", "digit": "4"}, {"emoji": "🌐", "name": "A pókhálós internet", "digit": "2"}, {"emoji": "🎣", "name": "Az adathalász folyosó", "digit": "6"}, {"emoji": "🔐", "name": "A jelszóvarázsló terme", "digit": "8"}, {"emoji": "🤖", "name": "A robotlabor", "digit": "5"}, {"emoji": "🧩", "name": "A végső kódműhely", "digit": "7"}];const tasks=[{"room": 0, "sub": 0, "question": "Melyik eszközzel mozgatod a nyilat a képernyőn?", "kind": "text", "answers": ["egér", "eger"], "hints": ["Az asztalon mozgatjuk.", "Kattintani is lehet vele. Az első betű: E."]}, {"room": 0, "sub": 1, "question": "Melyik eszközzel írsz betűket a gépbe?", "kind": "text", "answers": ["billentyűzet", "billentyuzet"], "hints": ["Sok gomb van rajta.", "A neve B betűvel kezdődik."]}, {"room": 0, "sub": 2, "question": "Melyik a KIMENETI eszköz?", "kind": "choice", "answers": ["Monitor", "Egér", "Billentyűzet"], "hints": ["A kimeneti eszköz megmutatja az információt.", "A képernyőn látod a képet."]}, {"room": 1, "sub": 0, "question": "Melyik alkatrész a számítógép „agya”, amely végrehajtja az utasításokat?", "kind": "choice", "answers": ["Processzor", "Monitor", "Egér"], "hints": ["A gépházban található.", "CPU-nak is nevezzük."]}, {"room": 1, "sub": 1, "question": "Mi tárolja a fájljaidat kikapcsolás után is? Írd be: SSD vagy merevlemez!", "kind": "text", "answers": ["ssd", "merevlemez", "hdd"], "hints": ["A képeid és dokumentumaid itt maradnak.", "Elfogadott válasz például: SSD."]}, {"room": 1, "sub": 2, "question": "Melyik alkatrész tárol ideiglenesen adatokat, miközben a gép dolgozik?", "kind": "choice", "answers": ["Memória (RAM)", "Billentyűzet", "Nyomtató"], "hints": ["A gépházban van, és gyors munkához kell.", "Hárombetűs rövidítése: RAM."]}, {"room": 2, "sub": 0, "question": "A töklámpás kép neve: tokfej.png. Mi a kiterjesztése?", "kind": "text", "answers": ["png"], "hints": ["A pont utáni betűket írd be.", "Három betű, p-vel kezdődik."]}, {"room": 2, "sub": 1, "question": "Melyik fájl lehet egy kép?", "kind": "choice", "answers": ["boszorkany.jpg", "zene.mp3", "jegyzet.txt"], "hints": ["A képeknél gyakori a JPG vagy PNG.", "A jó válasz .jpg végű."]}, {"room": 2, "sub": 2, "question": "Miért hasznosak a mappák?", "kind": "choice", "answers": ["Rendezhetjük bennük a fájlokat", "Gyorsabbá teszik az egeret", "Erősebbé teszik a jelszót"], "hints": ["Gondolj a valódi irattartó mappákra.", "A fájlok rendszerezésére valók."]}, {"room": 3, "sub": 0, "question": "Mit írunk a böngésző címsorába?", "kind": "choice", "answers": ["Webcímet", "Jelszavunkat minden oldalon", "A monitor típusát"], "hints": ["Egy weboldal eléréséhez kell.", "Például: iskola.hu"]}, {"room": 3, "sub": 1, "question": "A www rövidítés melyik világhálóhoz kapcsolódik?", "kind": "text", "answers": ["web", "világháló", "vilaghalo", "world wide web", "worldwideweb", "world-wide-web", "w w w", "www", "vilag halo"], "hints": ["Három angol szó kezdőbetűje.", "World Wide Web = világháló."]}, {"room": 3, "sub": 2, "question": "Igaz vagy hamis? Az interneten minden leírt információ biztosan igaz.", "kind": "choice", "answers": ["Hamis", "Igaz"], "hints": ["Az interneten bárki írhat téves dolgot.", "Mindig ellenőrizzük a forrást."]}, {"room": 4, "sub": 0, "question": "Ismeretlen levél jön: „Küldd el a jelszavad, különben baj lesz!” Megadod?", "kind": "choice", "answers": ["Nem", "Igen"], "hints": ["A jelszó titkos adat.", "Ismeretlennek SOHA nem adjuk meg."]}, {"room": 4, "sub": 1, "question": "Mit jelenthet a lakat jel a webcím mellett?", "kind": "choice", "answers": ["Titkosított kapcsolatot", "Hogy minden tartalom igaz", "Hogy nincs szükség jelszóra"], "hints": ["A kapcsolat biztonságáról mond valamit, nem a tartalom igazságáról.", "A helyes szó: titkosított."]}, {"room": 4, "sub": 2, "question": "Gyanús csatolmány érkezik idegentől. Mit teszel?", "kind": "choice", "answers": ["Nem nyitom meg, szólok a tanárnak", "Azonnal letöltöm", "Továbbküldöm mindenkinek"], "hints": ["Az ismeretlen fájl veszélyes lehet.", "Kérj segítséget megbízható felnőttől."]}, {"room": 5, "sub": 0, "question": "Melyik a legerősebb jelszó?", "kind": "choice", "answers": ["T0k!Hold_47", "123456", "halloween"], "hints": ["A hosszabb, változatos jelszó jobb.", "Van benne nagybetű, szám és különleges jel."]}, {"room": 5, "sub": 1, "question": "Szabad megosztani a jelszavadat egy osztálytársaddal?", "kind": "choice", "answers": ["Nem", "Igen"], "hints": ["A jelszó olyan, mint egy titkos kulcs.", "Nem adjuk oda másnak."]}, {"room": 5, "sub": 2, "question": "Mi véd még a jelszó mellett?", "kind": "choice", "answers": ["Kétlépcsős azonosítás", "Azonos jelszó mindenhol", "Jelszó a monitorra ragasztva"], "hints": ["Belépéskor lehet egy második ellenőrzés.", "Például telefonra érkező megerősítő kód."]}, {"room": 6, "sub": 0, "question": "A robot parancsai: előre = 1, jobbra = 2, balra = 3. Írd be: balra, előre, jobbra!", "kind": "text", "answers": ["312"], "hints": ["Cseréld minden szót a számára.", "Balra 3, előre 1, jobbra 2."]}, {"room": 6, "sub": 1, "question": "Mi az algoritmus?", "kind": "choice", "answers": ["Lépések pontos sorrendje", "Egy számítógépes vírus", "Egy képfájl"], "hints": ["A recept is hasonló elven működik.", "Sorban végrehajtott utasítások."]}, {"room": 6, "sub": 2, "question": "A robot ezt teszi: előre, előre, jobbra. Hány lépés szerepel összesen?", "kind": "text", "answers": ["3"], "hints": ["Minden parancs egy lépés.", "Számold meg a szavakat."]}, {"room": 7, "sub": 0, "question": "A titkos sor: A=1, B=2, C=3, D=4. Mennyi a CAB betűkódja?", "kind": "text", "answers": ["312"], "hints": ["Írd egymás mellé a betűk számait.", "C=3, A=1, B=2."]}, {"room": 7, "sub": 1, "question": "Melyik sorrendben készül jó digitális plakát?", "kind": "choice", "answers": ["Tervezés → készítés → ellenőrzés", "Törlés → készítés → tervezés", "Ellenőrzés → törlés → készítés"], "hints": ["A munka elején kitaláljuk, mit készítünk.", "A végén ellenőrzünk."]}, {"room": 7, "sub": 2, "question": "A szellem három számot hagyott: 2, 4, 6. Mi a következő szám?", "kind": "text", "answers": ["8"], "hints": ["Mindig kettővel nő.", "6 + 2 = ?"]}];const finalCode="31426857";let index=-1, hints=0, unlocked=0;const root=document.getElementById('game');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('hu-HU').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');const btn=(label,id)=>`<button type="button" id="${id}">${label}</button>`;function shell(body){root.innerHTML=body;}function start(){index=-1;hints=0;unlocked=0;shell(`<h1>🎃 A Halloween-kastély digitális titka</h1><p>Az elvarázsolt kastély ajtaja bezárult! A kijutáshoz <strong>8 szobán</strong> kell átjutnod. Mindegyikben <strong>3 rövid feladat</strong> vár rád.</p><div class="panel"><strong>🕯️ Küldetés:</strong> 24 feladat • 8 számjegy a végső zárhoz.<br>Ha elakadsz, használd a két segítséget! Hibázhatsz, nincs levonás és nincs időkorlát.</div><p>Írd fel a megszerzett számjegyeket a füzetedbe, mert a kapunál szükséged lesz rájuk!</p>${btn('🚪 Belépek a kastélyba','begin')}<footer>Offline is játszható. Nem gyűjt személyes adatot.</footer>`);document.getElementById('begin').onclick=()=>showTask(0)}function showTask(n){index=n;hints=0;if(n>=tasks.length){showGate();return;}let t=tasks[n],r=rooms[t.room];const response=t.kind==='choice'?`<fieldset class="choices" style="border:0;padding:0"><legend class="muted">Válassz egy választ!</legend>${t.answers.map((a,i)=>({a,i})).sort((a,b)=>((a.i+n%3)%3)-((b.i+n%3)%3)).map(({a,i})=>`<label><input type="radio" name="choice" value="${i}"><span>${escapeHtml(a)}</span></label>`).join('')}</fieldset>`:`<label for="answer" class="muted">Ide írd a válaszodat!</label><br><input id="answer" autocomplete="off" spellcheck="false" placeholder="Írd ide a megfejtést">`;shell(`<span class="badge">${t.room+1}. szoba / 8 · ${t.sub+1}. kérdés / 3</span><div class="progress" aria-label="Haladás"><div style="width:${100*n/tasks.length}%"></div></div><h2>${r.emoji} ${escapeHtml(r.name)}</h2><p><strong>${escapeHtml(t.question)}</strong></p>${response}<div>${btn('🔓 Ellenőrzés','check')}${btn('💡 Segítség ('+(2-hints)+')','hint')}</div><div id="feedback" role="status" aria-live="polite"></div><div id="hintArea"></div><footer>${n+1}. feladat a 24-ből • Eddig szerzett számjegyek: <span class="codes">${'● '.repeat(unlocked) || '–'}</span></footer>`);document.getElementById('check').onclick=check;document.getElementById('hint').onclick=hint;if(t.kind==='text'){let input=document.getElementById('answer');input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}}function hint(){let t=tasks[index];if(hints>=2)return;let p=document.createElement('p');p.className='panel';p.textContent='💡 '+t.hints[hints];document.getElementById('hintArea').appendChild(p);hints++;const b=document.getElementById('hint');b.textContent=`💡 Segítség (${2-hints})`;if(hints===2){b.disabled=true;let solution=document.createElement('div');solution.className='panel';let answer=document.createElement('p');answer.textContent='🗝️ Megoldás: '+t.answers[0];let advance=document.createElement('button');advance.type='button';advance.textContent='➡️ Tovább a megoldással!';advance.onclick=()=>completeTask();solution.append(answer,advance);document.getElementById('hintArea').appendChild(solution)}}function check(){let t=tasks[index],correct=false,v='';if(t.kind==='choice'){let selected=document.querySelector('input[name="choice"]:checked');if(!selected){document.getElementById('feedback').textContent='Válassz ki egy választ!';return}v=selected.value;correct=v==='0'}else{v=document.getElementById('answer').value;correct=t.answers.some(a=>norm(a)===norm(v))}if(correct){completeTask()}else{document.getElementById('feedback').innerHTML='<span class="bad">👻 Ez most nem jó. Próbáld újra, vagy kérj segítséget!</span>'}}function completeTask(){let t=tasks[index];if(t.sub===2){unlocked++;showBadge(t.room)}else{shell(`<h2 class="good">✅ Feladat teljesítve!</h2><p>Haladj tovább a következő feladatra!</p>${btn('➡️ Következő feladat','next')}`);document.getElementById('next').onclick=()=>showTask(index+1)}}function showBadge(room){let r=rooms[room];shell(`<h2 class="good">🗝️ Kinyílt a(z) ${room+1}. szoba ajtaja!</h2><p>Mindhárom feladatot sikeresen megoldottad.</p><div class="panel">Írd fel a <strong>${room+1}. számjegyet</strong> a füzetedbe!<div class="codes">${r.digit}</div></div><p>Már ${room+1} számjegyed van a 8-ból.</p>${btn(room===7?'🚪 Irány a végső kapu':'➡️ Következő szoba','next')}`);document.getElementById('next').onclick=()=>showTask(index+1)}function showGate(){shell(`<h1>🚪 A kastély végső kapuja</h1><p>Ügyes voltál! Mind a <strong>24 feladatot</strong> megoldottad. Írd be sorban a 8 összegyűjtött számjegyet! Az első szobáétól az utolsóig haladj!</p><label for="gate">A nyolcjegyű titkos kód:</label><br><input id="gate" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="8 számjegy"><div>${btn('🔐 Kapu kinyitása','unlock')}${btn('💡 Kódsegítség','gatehint')}</div><div id="feedback" role="status" aria-live="polite"></div>`);document.getElementById('unlock').onclick=()=>{let v=document.getElementById('gate').value.trim();if(v===finalCode){shell(`<h1>🎉 KIJUTOTTÁL! 🎃</h1><p>Az utolsó lakat is kinyílt. A Halloween-kastély digitális titkát megfejtetted!</p><div class="panel"><strong>🏆 Digitális nyomozó oklevél</strong><p>24 feladatot teljesítettél, és biztonságosan használtad a technológiai tudásodat.</p></div>${btn('🔄 Új játék','again')}`);document.getElementById('again').onclick=start}else document.getElementById('feedback').innerHTML='<span class="bad">A kapu zárva maradt. Ellenőrizd a számjegyek sorrendjét!</span>'};document.getElementById('gatehint').onclick=()=>{document.getElementById('feedback').textContent='A számjegyek sorrendje: 1–8. A kód: '+finalCode+'. Írd be a mezőbe, majd nyisd ki a kaput!'}}start();</script></body></html>
